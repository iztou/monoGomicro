name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 全量单测 + IT（codegen 的 GeneratedServicesRpcIT 会 install 生成工程并起双服务，
      # agent 的 AgentEntryIT fixture 固定 --release 17，与本机 JDK 版本解耦）
      - name: Maven verify
        run: mvn -B verify
